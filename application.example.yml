server:
  address: 0.0.0.0
  port: 2333
lavalink:
  plugins:
    - dependency: dev.lavalink.youtube:youtube-plugin:1.18.2
      snapshot: false
    - dependency: com.github.topi314.lavasrc:lavasrc-plugin:4.8.1
      snapshot: false
  server:
    sources:
      youtube: false
      soundcloud: true
      bandcamp: true
      twitch: true
      vimeo: true
      http: false
      local: false
plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: false
    allowDirectPlaylistIds: false
    clients:
      - MUSIC
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
  lavasrc:
    providers:
      - 'ytsearch:"%ISRC%"'
      - 'ytsearch:%QUERY%'
      - 'scsearch:%QUERY%'
    sources:
      spotify: false
      applemusic: false
      tidal: false
      deezer: false
    spotify:
      clientId: ""
      clientSecret: ""
      countryCode: SA
    applemusic:
      mediaAPIToken: ""
      countryCode: SA
